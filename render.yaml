# Render Infrastructure Blueprint
# Use this to deploy the FinPilot backend and PostgreSQL database with one click.
# Docs: https://render.com/docs/blueprints

databases:
  - name: finpilot-db
    plan: free
    databaseName: finpilot
    user: finpilot_admin

services:
  - type: web
    name: finpilot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      # Inject connection string from the database defined above
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
      
      # App Settings
      - key: ENV
        value: production
      
      # Security (Auto-generates a secure 256-bit random key)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "24"
      
      # CORS setup - initially allows all origins, update to your Vercel URL later
      - key: CORS_ORIGINS
        value: "*"
      
      # Third-Party Keys (Render will prompt you for these upon blueprint deployment)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
